name: Auto-post to LinkedIn

on:
  push:
    branches: [main]

jobs:
  post:
    runs-on: ubuntu-latest
    # Skip the post if the commit message contains [skip-post]
    if: ${{ !contains(github.event.head_commit.message, '[skip-post]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write and publish the LinkedIn post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          # Set the repo variable DRY_RUN to "false" when you are ready to post for real
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: node scripts/linkedin-post.mjs
